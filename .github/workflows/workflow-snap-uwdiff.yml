# UwDiff の snap（uwdiff/snap/snapcraft.yaml）を amd64 と arm64 で作り、Snap Store の edge に出す。
# UwView の snap（リポの直下の snap/）とは別の snap。UwView のタグ（v*）では動かさず、手で走らせる。
# 出したあと、stable への昇格は snapcraft.io のダッシュボード（Releases）で行う。
# 必要な secret: SNAPCRAFT_STORE_CREDENTIALS（uwview と uwdiff の両方を送れる鍵。README の手順で作る）
name: snap-uwdiff
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          path: uwdiff
      - uses: actions/upload-artifact@v4
        with:
          name: snap-uwdiff-${{ matrix.runner }}
          path: ${{ steps.build.outputs.snap }}
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
